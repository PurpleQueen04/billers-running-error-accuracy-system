
{% extends "base.html" %}

{% block title %}
Login | Billers Running Error & Accuracy System
{% endblock %}

{% block head %}
<style>
    .login-page {
        min-height: 65vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: white;
        border: 1px solid #e0e6ef;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(23, 32, 51, 0.07);
    }

    .login-title {
        text-align: center;
        margin: 0 0 8px;
        font-size: 24px;
        color: #172033;
    }

    .login-subtitle {
        text-align: center;
        color: #667085;
        font-size: 13px;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 7px;
        color: #344054;
    }

    .login-button {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
    }

    .login-footer {
        text-align: center;
        font-size: 12px;
        color: #98a2b3;
        margin-top: 22px;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 24px 20px;
        }

        .login-title {
            font-size: 22px;
        }
    }
</style>
{% endblock %}


{% block content %}

<div class="login-page">

    <div class="login-card">

        <h1 class="login-title">
            Welcome Back
        </h1>

        <p class="login-subtitle">
            Sign in to your account
        </p>


        <form method="POST" action="{{ url_for('login') }}">

            <input
                type="hidden"
                name="csrf"
                value="{{ session.get('csrf', '') }}"
            >


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    USERNAME
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                    autofocus
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >
                LOGIN
            </button>

        </form>


        <div class="login-footer">
            Billers Running Error & Accuracy System
        </div>

    </div>

</div>

{% endblock %}
